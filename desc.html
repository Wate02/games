<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Description</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root {
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --muted: #6b7280;
            --accent: #3b7a4a;
            --accent-light: #e9f8ee;
            --accent-dark: #163d20;
            --blue-light: #eef6ff;
            --blue-dark: #0c3a66;
            --gap: 14px;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            --radius: 12px;
        }
        
        :root[data-theme='dark'] {
            --bg: #181c1f;
            --card-bg: #23272b;
            --muted: #b0b8c1;
            --accent: #4ade80;
            --accent-light: #1a2e22;
            --accent-dark: #a7ffb0;
            --blue-light: #1a2333;
            --blue-dark: #60a5fa;
            --shadow: 0 4px 12px rgba(0,0,0,0.25);
        }
        
        * {
            box-sizing: border-box;
        }
        
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }
        
        body {
            font-family: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            background: var(--bg);
            color: #111;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
        }
        
        body[data-theme='dark'] {
            color: #e5e7eb;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: var(--card-bg);
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .back-button {
            display: flex;
            align-items: center;
            gap: 8px;
            background: none;
            border: none;
            color: var(--accent-dark);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 8px;
            transition: all 0.2s;
            font-family: inherit;
        }

        .back-button:hover {
            background: var(--accent-light);
        }

        .darkmode-toggle {
            display: flex;
            align-items: center;
            user-select: none;
        }
        
        .darkmode-toggle input[type="checkbox"] {
            display: none;
        }
        
        .darkmode-toggle label {
            cursor: pointer;
            font-size: 1.2em;
            transition: color 0.2s;
            color: var(--accent-dark);
            padding: 8px;
        }
        
        body[data-theme='dark'] .darkmode-toggle label {
            color: var(--accent);
        }
        
        .banner {
            width: 100%;
            height: 30vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: linear-gradient(135deg, var(--accent-light), var(--blue-light));
        }
        
        .banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        .info-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 20px;
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            gap: 20px;
        }
        
        .icon-name {
            display: flex;
            align-items: center;
            gap: 18px;
            flex: 1;
            min-width: 0;
        }
        
        .icon {
            height: 80px;
            width: 80px;
            border-radius: 12px;
            object-fit: cover;
            box-shadow: var(--shadow);
            flex-shrink: 0;
        }
        
        .name-section {
            min-width: 0;
            flex: 1;
        }
        
        .name {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0;
            color: var(--accent-dark);
        }
        
        .subtitle {
            color: var(--muted);
            font-size: 1rem;
            margin-top: 4px;
            font-weight: 400;
        }

        .action-buttons {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        #fav-star {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.8em;
            padding: 8px;
            border-radius: 8px;
            transition: all 0.2s;
            color: var(--muted);
        }

        #fav-star:hover {
            background: var(--accent-light);
        }

        #fav-star.active {
            color: #FFD600;
        }

        #fav-star:focus {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
        
        .play-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            background: var(--accent);
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            box-shadow: var(--shadow);
        }
        
        .play-button:hover {
            background: var(--accent-dark);
            transform: translateY(-1px);
        }
        
        .play-button:focus {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
        
        .play-button i {
            font-size: 1em;
        }
        
        .description {
            margin-top: 20px;
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
        }

        .description h3 {
            margin: 0 0 16px 0;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--accent-dark);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .description h3::before {
            content: '';
            width: 4px;
            height: 20px;
            background: var(--accent);
            border-radius: 2px;
        }
        
        .description p {
            font-size: 1rem;
            color: var(--muted);
            margin: 0;
            line-height: 1.6;
        }


        @media (max-width: 768px) {
            .container {
                padding: 0 15px;
            }

            .header {
                padding: 15px;
            }

            .banner {
                height: 25vh;
            }
            
            .info-row {
                flex-direction: column;
                align-items: stretch;
                gap: 16px;
            }
            
            .icon-name {
                align-self: flex-start;
            }

            .action-buttons {
                width: 100%;
                justify-content: space-between;
            }
            
            .play-button {
                flex: 1;
                justify-content: center;
                padding: 14px 20px;
            }

            .icon {
                width: 70px;
                height: 70px;
            }

            .name {
                font-size: 1.3rem;
            }

            .subtitle {
                font-size: 0.95rem;
            }
            
            .description {
                margin-top: 15px;
                padding: 20px;
            }
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 0 10px;
            }

            .header {
                padding: 12px;
            }

            .banner {
                height: 20vh;
            }
            
            .info-row {
                padding: 16px;
                gap: 12px;
            }

            .icon {
                width: 60px;
                height: 60px;
            }

            .name {
                font-size: 1.2rem;
            }

            .subtitle {
                font-size: 0.9rem;
            }
            
            .description {
                padding: 16px;
            }

            .description h3 {
                font-size: 1.1rem;
            }

            .description p {
                font-size: 0.95rem;
            }
        }


        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: var(--card-bg);
            border-radius: 12px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            border-radius: 12px;
            transition: all 0.3s ease;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, var(--accent-dark), var(--accent));
        }

        * {
            scrollbar-width: thin;
            scrollbar-color: var(--accent) var(--card-bg);
        }
    </style>
</head>
<body>
    <div class="header">
        <button class="back-button" onclick="window.history.back()">
            <i class="fas fa-arrow-left"></i>
           <span href="index.html">Back</span>
        </button>
        <div class="darkmode-toggle">
            <input type="checkbox" id="darkmode-switch" />
            <label for="darkmode-switch" title="Darkmode umschalten">
                <i class="fa-solid fa-moon"></i>
            </label>
        </div>
    </div>

    <div class="banner">
        <img src="https://wate02.github.io/games/img/replace-with-banner" alt="Banner">
    </div>

    <div class="container">
        <div class="info-row">
            <div class="icon-name">
                <img class="icon" src="https://wate02.github.io/games/img/replace-this-with-icon" alt="Icon">
                <div class="name-section">
                    <h2 id="name" class="name">gimme sum time...</h2>
                    <div class="subtitle">-</div>
                </div>
            </div>
            <div class="action-buttons">
                <button id="fav-star" title="Zu Favoriten hinzufügen">
                    <i class="fa-regular fa-star"></i>
                </button>
                <button class="play-button">
                    <i class="fa-solid fa-play"></i>
                    <span>Play</span>
                </button>
            </div>
        </div>

        <div class="description">

            <p id="desc-text">

            </p>
        </div>
    </div>

    <script>

        const darkSwitch = document.getElementById('darkmode-switch');
        const setTheme = (theme) => {
            document.documentElement.setAttribute('data-theme', theme);
            document.body.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
        };
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            darkSwitch.checked = true;
            setTheme('dark');
        }
        darkSwitch.addEventListener('change', (e) => {
            setTheme(e.target.checked ? 'dark' : 'light');
        });

        function getQueryParam(name) {
            const url = new URL(window.location.href);
            return url.searchParams.get(name);
        }


        function getFavorites() {
            const fav = document.cookie.split('; ').find(row => row.startsWith('favorites='));
            if (!fav) return [];
            try {
                return JSON.parse(decodeURIComponent(fav.split('=')[1]));
            } catch {
                return [];
            }
        }
        
        function setFavorites(favs) {
            document.cookie = "favorites=" + encodeURIComponent(JSON.stringify(favs)) + ";path=/;max-age=31536000";
        }
        
        function isFavorite(id) {
            return getFavorites().some(f => f.id === id);
        }
        
        function getNextOrder() {
            const favs = getFavorites();
            if (favs.length === 0) return 1;
            return Math.max(...favs.map(f => f.order)) + 1;
        }
        
        function toggleFavorite(id) {
            let favs = getFavorites();
            if (isFavorite(id)) {
                favs = favs.filter(f => f.id !== id);
            } else {
                favs.push({id, order: getNextOrder()});
            }
            setFavorites(favs);
            updateStar(id);
        }
        
        function updateStar(id) {
            const star = document.getElementById('fav-star');
            const icon = star.querySelector('i');
            if (isFavorite(id)) {
                star.classList.add('active');
                star.title = "Aus Favoriten entfernen";
                icon.className = 'fa-solid fa-star';
            } else {
                star.classList.remove('active');
                star.title = "Zu Favoriten hinzufügen";
                icon.className = 'fa-regular fa-star';
            }
        }

        async function loadApp() {
            try {
                const id = parseInt(getQueryParam('id'));
                if (!id) {
                    document.getElementById('name').textContent = 'Fehler: Keine App-ID gefunden';
                    document.getElementById('desc-text').textContent = 'Bitte geben Sie eine gültige App-ID an.';
                    return;
                }

                const res = await fetch('apps.json');
                if (!res.ok) throw new Error('Fehler beim Laden der App-Daten');
                
                const data = await res.json();
                const app = data.apps.find(a => a.id === id);
                
                if (!app) {
                    document.getElementById('name').textContent = 'App nicht gefunden';
                    document.getElementById('desc-text').textContent = 'Die angeforderte App konnte nicht gefunden werden.';
                    return;
                }


                const bannerImg = document.querySelector('.banner img');
                if (app.banner) {
                    bannerImg.src = app.banner;
                    bannerImg.alt = app.name + " Banner";
                } else {

                    bannerImg.style.display = 'none';
                }


                const iconImg = document.querySelector('.icon');
                if (app.icon) {
                    iconImg.src = app.icon;
                    iconImg.alt = app.name + " Icon";
                } else {

                    const initials = app.name.split(' ').map(word => word[0]).join('').substring(0, 2).toUpperCase();
                    iconImg.style.display = 'none';
                    const iconDiv = document.createElement('div');
                    iconDiv.className = 'icon';
                    iconDiv.style.background = 'linear-gradient(135deg, var(--accent), var(--accent-light))';
                    iconDiv.style.display = 'flex';
                    iconDiv.style.alignItems = 'center';
                    iconDiv.style.justifyContent = 'center';
                    iconDiv.style.fontSize = '1.5rem';
                    iconDiv.style.fontWeight = '700';
                    iconDiv.style.color = 'white';
                    iconDiv.textContent = initials;
                    iconImg.parentNode.replaceChild(iconDiv, iconImg);
                }


                document.getElementById('name').textContent = app.name;
                document.querySelector('.subtitle').textContent = app.subtext || '';
                document.getElementById('desc-text').textContent = app.description || '';


                document.querySelector('.play-button').onclick = () => {
                    if (app.redirect) {
                        window.open(app.redirect, '_blank');
                    }
                };

                updateStar(id);
                document.getElementById('fav-star').onclick = () => toggleFavorite(id);

            } catch (error) {
                console.error('Fehler beim Laden der App:', error);
                document.getElementById('name').textContent = 'Fehler beim Laden';
                document.getElementById('desc-text').textContent = 'Es ist ein Fehler beim Laden der App-Daten aufgetreten.';
            }
        }
        window.addEventListener('DOMContentLoaded', loadApp);
    </script>
</body>

</html>

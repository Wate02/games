<!DOCTYPE html>

<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favoriten</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --muted: #6b7280;
      --accent: #3b7a4a;
      --accent-light: #e9f8ee;
      --accent-dark: #163d20;
      --gap: 14px;
      --shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      --radius: 12px;
    }
    :root[data-theme='dark'] {
      --bg: #181c1f;
      --card-bg: #23272b;
      --muted: #b0b8c1;
      --accent: #4ade80;
      --accent-light: #1a2e22;
      --accent-dark: #a7ffb0;
      --shadow: 0 4px 12px rgba(0,0,0,0.25);
      --radius: 12px;
    }
    body {
      font-family: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: var(--bg);
      color: #111;
      margin: 0;
      min-height: 100vh;
    }
    body[data-theme='dark'] {
      color: #e5e7eb;
    }
    body:not([data-theme])::before {
      content: "";
      display: none;
    }
    .container {
      width: 100%;
      max-width: none;
      padding: 20px;
      margin: 0;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      margin-bottom: 20px;
      width: 100%;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 18px;
      font-weight: 700;
      font-size: 1.6rem;
      color: var(--accent-dark);
    }
    .darkmode-toggle {
      margin-left: 0;
      display: flex;
      align-items: center;
      user-select: none;
    }
    .darkmode-toggle input[type="checkbox"] {
      display: none;
    }
    .darkmode-toggle label {
      cursor: pointer;
      font-size: 1em;
      transition: color 0.2s;
      color: var(--accent-dark);
    }
    body[data-theme='dark'] .darkmode-toggle label {
      color: var(--accent);
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 24px;
      color: var(--accent);
      letter-spacing: 1px;
    }
    .favorites-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 600px;
    }
    .tile {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: var(--card-bg);
      border-radius: 10px;
      box-shadow: var(--shadow);
      transition: transform 0.2s;
      cursor: pointer;
      width: fit-content;
      min-width: 250px;
    }
    .tile:hover {
      transform: translateY(-3px);
    }
    .tile-icon {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 18px;
      background: linear-gradient(135deg, #f0fff4, #e9f8ee);
      color: var(--accent-dark);
      flex-shrink: 0;
    }
    .tile-meta {
      display: flex;
      flex-direction: column;
      min-width: 0;
      flex: 1;
    }
    .tile-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 2px;
      color: var(--accent-dark);
      text-overflow: ellipsis;
      overflow: hidden;
      white-space: nowrap;
    }
    .tile-sub {
      color: var(--muted);
      font-size: 1rem;
      text-overflow: ellipsis;
      overflow: hidden;
      white-space: nowrap;
    }
    .empty-msg {
      text-align: center;
      color: #888;
      margin-top: 60px;
      font-size: 1.1rem;
    }
    @media (max-width: 768px) {
      .container { 
        padding: 15px; 
      }
      .favorites-container { 
        max-width: 100%;
      }
    }
    @media (max-width: 600px) {
      .container { 
        padding: 10px 2px 90px 2px; 
      }
      .grid { 
        grid-template-columns: 1fr; 
        gap: 10px; 
      }
      .tile { 
        padding: 10px; 
      }
      .tile-icon { 
        width: 40px; 
        height: 40px; 
        font-size: 16px; 
      }
      .tile-title { 
        font-size: 1rem; 
      }
      .tile-sub { 
        font-size: 0.9rem; 
      }
    }
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: var(--card-bg);
      display: flex;
      justify-content: space-around;
      align-items: center;
      height: 70px;
      box-shadow: 0 -2px 12px rgba(0,0,0,0.15);
      border-top-left-radius: var(--radius);
      border-top-right-radius: var(--radius);
      z-index: 100;
    }
    .bottom-nav a {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: var(--muted);
      font-size: 12px;
      width: 80px;
      height: 55px;
      border-radius: var(--radius);
      transition: all 0.3s;
    }
    .bottom-nav a i {
      font-size: 20px;
      margin-bottom: 4px;
    }
    .bottom-nav a.active, .bottom-nav a:hover {
      background: var(--accent-light);
      color: var(--accent-dark);
    }
    body[data-theme='dark'] .bottom-nav a.active,
    body[data-theme='dark'] .bottom-nav a:hover {
      background: #477249;
      color: #fff;
    }
    html, body {
      overflow-x: hidden;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        wate02.github.io
        <div class="darkmode-toggle">
          <input type="checkbox" id="darkmode-switch" />
          <label for="darkmode-switch" title="Darkmode umschalten"><i class="fa-solid fa-moon"></i></label>
        </div>
      </div>
    </header>
    <div id="fav-grid" class="favorites-container"></div>
    <div id="empty-msg" class="empty-msg" style="display:none;">Keine Favoriten gespeichert.</div>
  </div>
  <div class="bottom-nav">
    <a href="index.html"><i class="fas fa-compass"></i>Discover</a>
    <a href="all.html"><i class="fas fa-plus"></i>All</a>
    <a href="favorites.html" class="active"><i class="fas fa-star"></i>Favorites</a>
    <a href="#"><i class="fas fa-cog"></i>Settings</a>
  </div>
  <script>
    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      document.body.setAttribute('data-theme', theme);
      localStorage.setItem('theme', theme);
      document.getElementById('darkmode-switch').checked = (theme === 'dark');
    }
    function syncTheme() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark') setTheme('dark');
      else setTheme('light');
    }
    document.getElementById('darkmode-switch').addEventListener('change', (e) => {
      setTheme(e.target.checked ? 'dark' : 'light');
    });
    syncTheme();
    function getFavorites() {
      const fav = document.cookie.split('; ').find(row => row.startsWith('favorites='));
      if (!fav) return [];
      try {
        return JSON.parse(decodeURIComponent(fav.split('=')[1]));
      } catch {
        return [];
      }
    }
    function setFavorites(favs) {
      document.cookie = "favorites=" + encodeURIComponent(JSON.stringify(favs)) + ";path=/;max-age=31536000";
    }
    function removeFavorite(id) {
      let favs = getFavorites();
      favs = favs.filter(f => f.id !== id);
      setFavorites(favs);
      renderFavorites();
    }
    function getInitials(name) {
      const words = name.split(' ');
      let initials = '';
      for (let i = 0; i < Math.min(2, words.length); i++) {
        initials += words[i][0].toUpperCase();
      }
      return initials;
    }
    async function renderFavorites() {
      const favGrid = document.getElementById('fav-grid');
      const emptyMsg = document.getElementById('empty-msg');
      favGrid.innerHTML = '';
      const favs = getFavorites();
      if (!favs.length) {
        emptyMsg.style.display = '';
        return;
      }
      emptyMsg.style.display = 'none';
      let appsData;
      try {
        const res = await fetch('apps.json');
        appsData = await res.json();
      } catch {
        favGrid.innerHTML = '<div class="empty-msg">Fehler beim Laden der App-Daten.</div>';
        return;
      }
      const sortedFavs = [...favs].sort((a, b) => a.order - b.order);
      for (const fav of sortedFavs) {
        const app = appsData.apps.find(a => a.id === fav.id);
        if (!app) continue;
        const tile = document.createElement('div');
        tile.className = 'tile';
        let iconHtml;
        if (app.icon && app.icon.trim() !== "") {
          iconHtml = `<img class="tile-icon" src="${app.icon}" alt="${app.name}" style="object-fit:cover;" />`;
        } else {
          iconHtml = `<div class="tile-icon">${getInitials(app.name)}</div>`;
        }
        tile.innerHTML = `
          ${iconHtml}
          <div class="tile-meta">
            <div class="tile-title">${app.name}</div>
            <div class="tile-sub">${app.subtext || ''}</div>
          </div>
        `;
        const iconElem = tile.querySelector('.tile-icon');
        iconElem.style.cursor = 'pointer';
        iconElem.addEventListener('click', (e) => {
          e.stopPropagation();
          window.open(app.redirect, '_blank');
        });
        tile.onclick = (e) => {
          if (e.target.closest('.tile-icon')) return;
          window.location.href = `desc.html?id=${app.id}`;
        };
        favGrid.appendChild(tile);
      }
    }
    window.addEventListener('DOMContentLoaded', renderFavorites);
    window.addEventListener('storage', syncTheme);
  </script>
</body>
</html>
